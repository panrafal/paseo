# Fork desktop release.
#
# Upstream's desktop-release.yml publishes to getpaseo/paseo and carries the
# rollout, changelog and multi-platform machinery a public release needs. This
# is the fork's own, much smaller path: tag `fork-v<version>` on `main` — this
# fork's integration branch — and get a signed, notarized macOS build published
# to a release on this fork, with the in-app updater pointed here instead of
# upstream.
#
# The fork version always carries a prerelease suffix (0.7.2-panrafal.1). The
# desktop app picks its update channel from its own settings, not from the
# version string, so a fork build has to be on the "beta" channel to look for
# beta-mac.yml — which is what this workflow uploads.
#
# Required repo secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER. No Apple ID and no
# app-specific password: notarization goes through an App Store Connect API
# key, which is revocable on its own and carries no account login.

name: Fork Desktop

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork-v* tag to build"
        required: true
        type: string

concurrency:
  group: fork-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORK_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  DESKTOP_PACKAGE_PATH: "packages/desktop"
  RELEASE_CHANNEL: beta

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: echo "version=${FORK_TAG#fork-v}" >> "$GITHUB_OUTPUT"
      - name: Create or reuse the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$FORK_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $FORK_TAG already exists"
          else
            gh release create "$FORK_TAG" \
              --repo "${{ github.repository }}" \
              --title "Fork build ${FORK_TAG#fork-v}" \
              --prerelease \
              --notes "Personal fork build of Paseo: upstream main plus the branches listed in fork/branches on the fork-base branch."
          fi

  macos:
    needs: [create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            electron_arch: arm64
          - runner: macos-15-intel
            electron_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Stamp the fork version
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const p = `${process.env.DESKTOP_PACKAGE_PATH}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.FORK_TAG.replace(/^fork-v/, "");
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '

      # electron-builder takes the Apple ID notarization path the moment
      # APPLE_ID or APPLE_APP_SPECIFIC_PASSWORD is set, and then demands the
      # whole trio, so neither may appear here even empty. APPLE_TEAM_ID is
      # read only by that path; CSC_LINK signing does not need it.
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/asc-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # APPLE_API_KEY is a path, not the key, so the .p8 has to reach disk.
          # It travels through the environment rather than an argument, which
          # would be readable in `ps`, and umask makes the file 0600 from the
          # moment it exists. Outside the repo tree so no later step can pack
          # it into an artifact.
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" >"$APPLE_API_KEY")

          # publish.owner/repo are what the shipped app-update.yml records, so
          # this is the line that makes the installed app update from the fork.
          npm run build:desktop -- --publish never --mac --${{ matrix.electron_arch }} \
            "-c.publish.provider=github" \
            "-c.publish.owner=${{ github.repository_owner }}" \
            "-c.publish.repo=${{ github.event.repository.name }}" \
            "-c.publish.channel=${RELEASE_CHANNEL}"

      # The runner is ephemeral, but the key is gone the moment it stops being
      # needed rather than whenever the VM is torn down.
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "${{ runner.temp }}/asc-api-key.p8"

      - name: Upload artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$DESKTOP_PACKAGE_PATH/release"
          gh release upload "$FORK_TAG" --repo "${{ github.repository }}" --clobber \
            *.dmg *.zip

      - name: Keep the arch manifest for merging
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-${{ matrix.electron_arch }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}-mac.yml
          retention-days: 1

  publish-manifest:
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-manifest-*
      # One update feed has to describe both architectures, or whichever arch
      # uploads last wins and the other stops seeing updates.
      - name: Merge and upload the update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/merge-mac-manifest.mjs \
            "mac-manifest-arm64/${RELEASE_CHANNEL}-mac.yml" \
            "mac-manifest-x64/${RELEASE_CHANNEL}-mac.yml" \
            "${RELEASE_CHANNEL}-mac.yml"
          gh release upload "$FORK_TAG" --repo "${{ github.repository }}" --clobber \
            "${RELEASE_CHANNEL}-mac.yml"
