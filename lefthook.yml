pre-commit:
  # Fork: off on fork-base and main. The hook runs the whole-repo typecheck
  # on every commit, which needs node_modules and built declarations in the
  # checkout. Patch branches are cut from upstream/main, do not carry this
  # change, and keep the hooks: they are PRs and get upstream's checks.
  skip: true
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    - name: typecheck
      run: npm run typecheck
