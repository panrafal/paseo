pre-commit:
  # Fork: off. The hook runs the whole-repo typecheck on every commit, which
  # needs node_modules and built declarations in every worktree; the checks
  # run in CI on the PRs instead. Patch branches do not carry this file — the
  # worktree setup in paseo.json drops a lefthook-local.yml there.
  skip: true
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    - name: typecheck
      run: npm run typecheck
